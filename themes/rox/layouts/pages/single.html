{{ define "main" }}
    <div class="w-1/2 mx-auto py-5">
        <div class="border-b pb-3">
            <h1 class="text-4xl font-normal text-gray-700 mb-1">
                <a href="{{ .RelPermalink }}">{{ .Title }}</a>
            </h1>
        </div>
        <div class="featured">
            {{ .Params.featured }}
        </div>
        <div class="py-2 text-gray-700 text-justify">
            {{ .Content }}
        </div>
    </div>
{{ end }}
