# All available Hugo versions are listed here: https://gitlab.com/pages/hugo/container_registry
image: registry.gitlab.com/pages/hugo/hugo_extended:latest

variables:
  GIT_SUBMODULE_STRATEGY: recursive

test:
  script:
    - apk add npm
    - npm install
    - hugo
  except:
  - master

pages:
  script:
    - apk add npm
    - npm install
    - hugo
  artifacts:
    paths:
    - public
  only:
  - master
